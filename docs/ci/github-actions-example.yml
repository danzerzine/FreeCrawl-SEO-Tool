# FreeCrawl SEO — example GitHub Actions workflow
#
# Crawls your site with the headless CLI on every push and on a daily
# schedule, fails the build when a rule in freecrawl-rules.json fires, validates
# the sitemap, and uploads the crawl as a build artifact. Adapt TARGET_URL
# and the thresholds to your site.
#
# Save this as `.github/workflows/freecrawl-audit.yml` in your own repo.
# No FreeCrawl install is required on the runner — the workflow clones the
# source and builds the CLI (plus its workspace packages) from it.
#
# See docs/ci/README.md for the CLI exit-code contract, the rule file format, a zero-tolerance
# (no-script) gate variant, and how to add a regression-compare job.

name: FreeCrawl SEO Audit

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC daily
  workflow_dispatch:

env:
  TARGET_URL: https://example.com
  MAX_URLS: '5000'
  
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kemalai/FreeCrawl-SEO-Tool
          path: freecrawl

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: freecrawl/package-lock.json

      - name: Install + build CLI
        working-directory: freecrawl
        run: |
          # --ignore-scripts skips the Playwright browser download; the CLI's
          # default crawl is undici-based and needs no Chromium. Drop the flag
          # only if you enable JS rendering through a --config file.
          npm ci --ignore-scripts
          # Build the CLI and its workspace deps (shared-types → db → core) in
          # dependency order via project references. The heavy Electron desktop
          # build is intentionally skipped — `npm run build:cli` alone would
          # NOT build the packages the CLI imports and the crawl would fail.
          npx tsc -b apps/cli

      - name: Crawl ${{ env.TARGET_URL }}
        working-directory: freecrawl
        run: |
          # The crawl writes a project (--db) and records itself in its history;
          # the gate below judges it. `|| true`: the CLI itself exits 1 on ANY
          # 4xx/5xx, and the rules decide what fails the build.
          node apps/cli/dist/bin.js "$TARGET_URL" \
            --max "$MAX_URLS" \
            --db "$GITHUB_WORKSPACE/site.seoproject" \
            --out "$GITHUB_WORKSPACE/crawl.json" || true

      - name: Gate on rules
        working-directory: freecrawl
        run: |
          # freecrawl-rules.json lives in your repo (format: docs/ci/README.md).
          # Exit 1 when a fail rule fired; the log lists every rule's status.
          node apps/cli/dist/bin.js check \
            --project "$GITHUB_WORKSPACE/site.seoproject" \
            --rules "$GITHUB_WORKSPACE/freecrawl-rules.json"
          # Optional: --notify slack with FREECRAWL_SLACK_WEBHOOK_URL from secrets.

      - name: Validate sitemap (non-blocking)
        working-directory: freecrawl
        continue-on-error: true
        run: node apps/cli/dist/bin.js validate-sitemap "$TARGET_URL/sitemap.xml"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freecrawl-audit-${{ github.run_number }}
          path: |
            crawl.json
          retention-days: 30
